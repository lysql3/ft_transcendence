services:
  backend:
    build:
      target: prod
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  backend-migrate:
    build:
      target: build
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BETTER_AUTH_URL=https://localhost
      - FRONTEND_URL=https://localhost
    command: npm run prisma:migrate:deploy

  frontend-nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ft_tra_networks
    ports:
      - "${FRONTEND_PROD_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"
