services:
  backend:
    build:
      target: prod
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  backend-migrate:
    build:
      target: build
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BETTER_AUTH_URL=https://localhost
      - FRONTEND_URL=https://localhost
    command: npm run prisma:migrate:deploy

  frontend:
    build:
      target: prod
    ports:
      - "${FRONTEND_PROD_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"
