services:
  postgres:
    build:
      target: prod
    env_file:
      - .env

  backend:
    build:
      target: prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

  backend-migrate:
    build:
      target: build
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: npm run prisma:migrate:deploy

  frontend:
    build:
      target: prod
    ports:
      - "${FRONTEND_PROD_PORT:-443}:443"
      - "${FRONTEND_HTTP_PORT:-80}:80"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
