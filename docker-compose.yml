services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ft_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000

  nginx:
    build:
      context: ./infra
      dockerfile: Dockerfile
    container_name: ft_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
