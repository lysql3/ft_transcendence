services:
  postgres:
    build: ./database
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ft_tra_networks

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80" # temporary, remove when the main Nginx (Feature 1.5) fronts it
    networks:
      - ft_tra_networks

networks:
  ft_tra_networks:
    driver: bridge

volumes:
  pgdata:

    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    # for presistance and hot reloading of node_modules in dev mode
