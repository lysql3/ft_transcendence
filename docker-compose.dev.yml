services:
  postgres:
    build:
      target: dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    env_file:
      - .env.dev

  backend:
    build:
      target: dev
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
